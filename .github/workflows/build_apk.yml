name: Build and Release Lemus Studio APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Java 17 as default
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            ffmpeg libjpeg-dev

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Pin Cython 3.0.11 for build isolation
        run: |
          echo "cython==3.0.11" > /tmp/p4a-constraints.txt
          echo "PIP_CONSTRAINT=/tmp/p4a-constraints.txt" >> $GITHUB_ENV

      # ЯДЕРНАЯ ОЧИСТКА КЭША (убиваем старые x86_64 .so/.whl)
      - name: Nuclear cleanup of ALL caches (fix x86_64 leak)
        run: |
          rm -rf ~/.cache/pip || true
          rm -rf ~/.buildozer || true
          rm -rf .buildozer || true
          find /home/runner -name "*.whl" -delete 2>/dev/null || true
          rm -rf /tmp/pip-* || true
          echo "✅ All pip/buildozer caches purged"

      - name: Syntax Check
        run: python -m py_compile main.py

      # СБОРКА БЕЗ PIP_NO_INDEX (pip может качать KivyMD и другие online-зависимости)
      - name: Build APK (online deps allowed, auto-accept licenses)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONNOUSERSITE: "1"
        run: yes | buildozer android debug

      # ПРОВЕРКА АРХИТЕКТУРЫ ВНУТРИ APK (гарантия отсутствия x86_64 мусора)
      - name: VERIFY APK architecture integrity
        run: |
          cd bin
          if ! ls *.apk >/dev/null 2>&1; then
            echo "❌ No APK produced!"
            exit 1
          fi
          mkdir -p _verify && cd _verify
          unzip -q ../$(ls ../*.apk | head -n1) 'lib/*' || { echo "Unzip failed"; exit 1; }
          
          BAD_COUNT=$(find lib -type f \( -name '*x86_64*' -o -name '*amd64*' -o -name '*linux-gnu*' \) 2>/dev/null | wc -l)
          GOOD_COUNT=$(find lib -type f -name '*aarch64*android*' 2>/dev/null | wc -l)
          
          echo "=== ARCHITECTURE REPORT ==="
          echo "Suspicious files (x86/amd64/linux-gnu): $BAD_COUNT"
          echo "Valid Android ARM64 files: $GOOD_COUNT"
          
          if [ "$BAD_COUNT" != "0" ]; then
            echo ""
            echo "🚨 CRITICAL: Found non-Android binaries inside APK:"
            find lib -type f \( -name '*x86_64*' -o -name '*amd64*' -o -name '*linux-gnu*' \) 2>/dev/null
            echo ""
            echo "This causes instant crash on phone. Aborting."
            exit 1
          fi
          
          if [ "$GOOD_COUNT" == "0" ]; then
            echo "⚠️ Warning: No valid aarch64-android libs detected either."
          else
            echo "✅ All libraries are native Android ARM64"
          fi
          cd .. && rm -rf _verify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemusStudio-v2.6.9-ARM64-CLEAN
          path: bin/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          generate_release_notes: true
