name: Build and Release Lemus Studio APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Java 17 as default
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            ffmpeg libjpeg-dev

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Pin Cython for build isolation
        run: |
          echo "cython==3.0.11" > /tmp/p4a-constraints.txt
          echo "PIP_CONSTRAINT=/tmp/p4a-constraints.txt" >> $GITHUB_ENV

      - name: Purge all caches
        run: |
          rm -rf ~/.cache/pip ~/.buildozer .buildozer /tmp/pip-* || true

      - name: Syntax Check
        run: python -m py_compile main.py

      - name: Build APK (auto-accept licenses)
        run: yes | buildozer android debug

      - name: VERIFY whole APK for host-tagged binaries
        run: |
          cd bin
          ls *.apk || { echo "❌ No APK"; exit 1; }
          mkdir -p _v && cd _v
          unzip -q ../$(ls ../*.apk | head -n1)
          BAD=$(find . -type f \( -name '*x86_64*' -o -name '*linux-gnu*' -o -name '*amd64*' \) | wc -l)
          echo "Host-tagged files inside APK: $BAD"
          if [ "$BAD" != "0" ]; then
            find . -type f \( -name '*x86_64*' -o -name '*linux-gnu*' -o -name '*amd64*' \) | head -30
            echo "🚨 APK contains desktop binaries — will crash on phone. Failing build."
            exit 1
          fi
          echo "✅ APK clean: only Android ARM64 binaries"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemusStudio-v2.7.2-FINAL
          path: bin/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          generate_release_notes: true
